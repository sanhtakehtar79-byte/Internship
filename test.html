<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="tree.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table_assignment</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        table{
            margin: auto;
        }
        table,th,td{
         border: 1px solid white; 
         border-collapse: collapse;  
         font-family:sans-serif;
        }        
        th{
            background-color: rgb(202, 227, 238);
        }
        td{
            background-color: rgb(219, 243, 179);
        }
        .mark{
            text-align: right;   
        }
        .no{
            text-align: center;
        }
        .gender{
           text-align: center; 
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Student Name</th>
            <th rowspan="2">Gender</th>
            <th rowspan="2">Roll No.</th>
            <th colspan="3">Marks</th>
        </tr>
        <tr>
            <th>Myanmar</th>
            <th>English</th>
            <th>Math</th>
        </tr>
        <tr>
            <td class="no">1</td>
            <td>Su Su</td>
            <td rowspan="2" class="gender">Female</td>
            <td>5CS-32</td>
            <td class="mark">60</td>
            <td class="mark">75</td>
            <td class="mark">86</td>
        </tr>
        <tr>
            <td class="no">2</td>
            <td>Moe Moe</td>
            <td>5CS-33</td>
            <td class="mark">60</td>
            <td class="mark">75</td>
            <td class="mark">86</td>
        </tr>
        <tr>
            <td class="no">3</td>
            <td>Kyaw Kyaw</td>
            <td rowspan="3" class="gender">Male</td>
            <td>5CS-34</td>
            <td class="mark">78</td>
            <td class="mark">86</td>
            <td class="mark">84</td>
        </tr>
        <tr>
            <td class="no">4</td>
            <td>Mg Mg</td>
            <td>5CS-35</td>
            <td class="mark">89</td>
            <td class="mark">43</td>
            <td class="mark">86</td>
        </tr>
        <tr>
            <td class="no">5</td>
            <td>Aung Aung</td>
            <td>5CS-36</td>
            <td class="mark">87</td>
            <td class="mark">75</td>
            <td class="mark">86</td>
        </tr>
    </table>
</body>
</html>
