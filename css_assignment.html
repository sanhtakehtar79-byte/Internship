<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 88%;
            margin: auto;
            border: 1px solid ;
        }
        h3{
            display: inline;
            width: 1000px;
        }
        nav{
            background-color: rgb(13, 13, 42);
            display: flex;
            padding: 12px;
            margin-top: 1%;
            color: #fffafa;
        }
        nav .rightside{
            display: flex;
            justify-content: space-around;
            width: 300px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>CSS Utility Simulator</h1> 
    <p>Change the inputs below to see how atomic classes combine to build UIs.</p>
        <nav>
            <h3>MyLogo</h2>
                <div class="rightside">
                    <span>Home</span>
                    <span>About</span>
                    <span>Contact</span>
                </div>
        </nav>
</div>
</body>
</html>
